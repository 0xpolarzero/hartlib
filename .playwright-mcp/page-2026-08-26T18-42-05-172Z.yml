                    - paragraph [ref=e2313]: "{\"summary\":\"Failed. The live Gateway route loaded and all six widths were checked, but the dashboard mislabels pending nodes as failed, queries missing outcome nodes, shows inconsistent agent state, lacks required retention and crash-resume proof, overflows at three widths, and does not sync run selection to the route.\",\"passed\":false,\"findings\":[{\"id\":\"status-model-false-failures\",\"severity\":\"high\",\"detail\":\"The Verification tab reports 0/6 passed and 6 failed, while its table and the live run tree show all six checks as pending. Fifteen output cards report failure because the UI requests base node IDs such as check_migration_0074 instead of loop-qualified IDs such as check_migration_0074@@automation_review_stabilization=0. This also corrupts failed versus skipped, migration, and live-flow reporting.\",\"requiredFix\":\"Resolve output cards against the materialized node IDs from the live run tree. Treat absent or non-materialized nodes as pending, preserve skipped as a separate state, and mark a node failed only when Gateway stores a failed state or failure envelope.\"},{\"id\":\"missing-outcome-node-targets\",\"severity\":\"high\",\"detail\":\"The External blockers and Approval panels query emit_verification_blocked_result and emit_approval_denied_result, but neither node exists in the live graph. Both cards therefore show false Node not found failures even though the approvals endpoint returns successfully.\",\"requiredFix\":\"Bind each outcome card to a real graph node or derive its conditional state from the run tree and approval record. Do not convert a 404 for a nonexistent conditional node into a failed or denied result.\"},{\"id\":\"agent-fleet-chat-drift\",\"severity\":\"high\",\"detail\":\"plan_integration_waves is complete and has a successful output envelope, but its chat card says No agent output yet. The current review node appears as Sol review and RUNNING in the fleet while its stream header says codex and PENDING. Finished chat, ownership, and status do not share one live source.\",\"requiredFix\":\"Derive fleet rows and chat headers from the same Gateway node and agent metadata. Render the stored transcript for completed nodes, or show a source-specific transcript error instead of treating missing chat as an empty result.\"},{\"id\":\"retention-deletion-diff-proof-missing\",\"severity\":\"high\",\"detail\":\"The Retention tab shows FAILED but contains only the frozen baseline count and digest. Byte match, removed files, retained items, reachability findings, deletion proof, and integrated diff are blank or absent. The Retained bytes KPI displays the first 12 characters of a SHA digest rather than a byte count.\",\"requiredFix\":\"Keep this section pending until its source nodes run. Populate retention, deletion, ownership, and diff fields only from live output envelopes, and display byte counts and digests as separate correctly labeled values.\"},{\"id\":\"crash-resume-log-proof-missing\",\"severity\":\"medium\",\"detail\":\"The dashboard claims crash-resume state loaded in a KPI, but it provides no checkpoint or snapshot ID, restart boundary, resume event, or before-and-after state proof. The durable event list alone does not prove that this run crashed and resumed.\",\"requiredFix\":\"Show the latest durable checkpoint or frame, worker loss or restart event, resume timestamp, restored node state, and linked log entries. Label the state as unavailable or not exercised when Gateway has no such evidence.\"},{\"id\":\"responsive-outer-overflow\",\"severity\":\"medium\",\"detail\":\"The main workflow content overflows horizontally by 1056 px at 320 px, 986 px at 390 px, and 378 px at 1024 px. The wide preflight table expands the full dashboard instead of containing its own overflow. No outer overflow occurred at 1535, 1536, or 1920 px.\",\"requiredFix\":\"Contain wide tables in local scroll regions or switch them to stacked cards at widths up to 1024 px. Keep the outer workflow content within the viewport at every required width.\"},{\"id\":\"run-selection-route-drift\",\"severity\":\"medium\",\"detail\":\"Selecting cancelled run run-1787760762878 updated the visible dashboard, but location.href remained on runId=run-1787760837339. Reloading or sharing the page would open a different run from the one under review.\",\"requiredFix\":\"Update the runId query parameter whenever selection changes and initialize the selected run from that same route state.\"}],\"routeEvidence\":[\"GET http://127.0.0.1:53191/workflows/implement-ui-playground-demo-cutover?runId=run-1787760837339 returned 200 with title UI Playground Demo Cutover.\",\"Gateway identity: http://127.0.0.1:53191; workspace /Users/polarzero/code/projects/brief; backend sqlite; version 0.31.0; auth none.\",\"GET /v1/api/runs?workflow=implement-ui-playground-demo-cutover&limit=40 returned 200 and listed run-1787760837339 as running and run-1787760762878 as cancelled.\",\"GET /v1/api/runs/run-1787760837339, /tree, /events, /approvals, and /stream returned 200.\",\"Completed output envelopes for freeze_contracts, persist_frozen_baseline, and plan_integration_waves returned 200. Base or nonexistent output IDs used by failed cards returned 404.\",\"The route was checked at 320, 390, 1024, 1535, 1536, and 1920 px with a 900 px viewport height.\",\"Selecting run-1787760762878 showed its cancelled data while the route still contained runId=run-1787760837339.\"],\"screenshotArtifacts\":[\"/Users/polarzero/code/projects/brief/cutover-dashboard-320-top.png\",\"/Users/polarzero/code/projects/brief/cutover-dashboard-390-top.png\",\"/Users/polarzero/code/projects/brief/cutover-dashboard-1024-top.png\",\"/Users/polarzero/code/projects/brief/cutover-dashboard-1535-top.png\",\"/Users/polarzero/code/projects/brief/cutover-dashboard-1536-top.png\",\"/Users/polarzero/code/projects/brief/cutover-dashboard-1920-top.png\",\"/Users/polarzero/code/projects/brief/cutover-verificat