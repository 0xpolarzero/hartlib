services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hartlib
      POSTGRES_PASSWORD: hartlib
      POSTGRES_DB: hartlib
    ports:
      - "127.0.0.1:${HARTLIB_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hartlib -d postgres -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
